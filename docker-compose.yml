# Self-host the whole stack:   docker compose up -d --build
# ...with automatic HTTPS:     docker compose --profile https up -d --build   (set DOMAIN in .env)
# Database only (local dev):   docker compose up -d db
#
# Settings come from .env (copy .env.example). NEXTAUTH_SECRET must be set.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound to localhost only, so the database is never exposed on a server's public interface.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc_dev_password}
      POSTGRES_DB: grc_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc -d grc_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Set APP_BIND=127.0.0.1 when a proxy (e.g. the caddy service) is the only way in.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql://grc:${POSTGRES_PASSWORD:-grc_dev_password}@db:5432/grc_platform
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (see README)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads

  # Optional HTTPS front door. Needs DOMAIN in .env and ports 80/443 open to the internet.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
