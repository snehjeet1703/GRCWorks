name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation. For example, "During our SOC 2 audit we need to …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compliance / frameworks
        - Controls & evidence
        - Risks
        - Policies
        - Vendors & questionnaires
        - Trust Center
        - Users, roles & sign-in
        - Deployment & operations
        - Other
